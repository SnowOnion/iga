<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>弓箭手游戏图像资源生成器</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1, h2 {
            color: #333;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }
        .image-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            width: 300px;
        }
        .image-card h3 {
            margin-top: 0;
        }
        canvas {
            border: 1px solid #ddd;
            margin-bottom: 10px;
            background-color: transparent;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        .download-all {
            background-color: #2196F3;
            padding: 12px 20px;
            font-size: 16px;
            margin: 20px 0;
        }
        .instructions {
            background-color: #fff3cd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>弓箭手游戏图像资源生成器</h1>
    
    <div class="instructions">
        <h2>使用说明</h2>
        <p>1. 点击每个图像下方的"下载"按钮可以单独下载该图像</p>
        <p>2. 所有图像都会自动生成，你可以根据需要调整</p>
        <p>3. 下载后，请将图像放入 assets/images 目录中</p>
    </div>
    
    <button class="download-all" onclick="downloadAllImages()">下载所有图像</button>
    
    <h2>精灵表 (Spritesheets)</h2>
    <div class="container" id="spritesheets">
        <!-- 精灵表将在这里生成 -->
    </div>
    
    <h2>单张图像</h2>
    <div class="container" id="single-images">
        <!-- 单张图像将在这里生成 -->
    </div>
    
    <h2>UI元素</h2>
    <div class="container" id="ui-elements">
        <!-- UI元素将在这里生成 -->
    </div>
    
    <script>
        // 图像配置
        const spritesheets = [
            { name: 'archer', width: 256, height: 256, frameWidth: 64, frameHeight: 64, frames: 16, rows: 4, color: '#3498db' },
            { name: 'enemies', width: 192, height: 96, frameWidth: 32, frameHeight: 32, frames: 18, rows: 3, color: '#e74c3c' },
            { name: 'arrow', width: 128, height: 8, frameWidth: 32, frameHeight: 8, frames: 4, rows: 1, color: '#8B4513' },
            { name: 'explosion', width: 192, height: 32, frameWidth: 32, frameHeight: 32, frames: 6, rows: 1, color: '#f39c12' },
            { name: 'hit_effect', width: 192, height: 32, frameWidth: 32, frameHeight: 32, frames: 6, rows: 1, color: '#f1c40f' }
        ];
        
        const singleImages = [
            { name: 'particle', width: 8, height: 8, color: '#3498db' },
            { name: 'blood_particle', width: 8, height: 8, color: '#e74c3c' },
            { name: 'arrow_trail', width: 16, height: 4, color: '#f39c12' },
            { name: 'tileset', width: 256, height: 256, color: '#95a5a6', grid: true },
            { name: 'background', width: 800, height: 600, color: '#87CEEB', gradient: true },
            { name: 'mountains', width: 800, height: 200, color: '#34495e', mountains: true }
        ];
        
        const uiElements = [
            { name: 'button', width: 200, height: 50, color: '#3498db', rounded: true, text: '按钮' },
            { name: 'title', width: 400, height: 100, color: '#f1c40f', text: '弓箭手冒险', fontSize: 36 },
            { name: 'game-over', width: 400, height: 100, color: '#e74c3c', text: '游戏结束', fontSize: 36 },
            { name: 'level-complete', width: 400, height: 100, color: '#2ecc71', text: '关卡完成', fontSize: 36 },
            { name: 'loading-background', width: 400, height: 50, color: '#34495e', rounded: true },
            { name: 'loading-bar', width: 380, height: 30, color: '#2ecc71', rounded: true }
        ];
        
        // 生成精灵表
        function generateSpritesheet(config) {
            const canvas = document.createElement('canvas');
            canvas.width = config.width;
            canvas.height = config.height;
            const ctx = canvas.getContext('2d');
            
            // 清除背景
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制帧
            let frameIndex = 0;
            for (let row = 0; row < config.rows; row++) {
                const framesPerRow = Math.floor(config.width / config.frameWidth);
                for (let col = 0; col < framesPerRow && frameIndex < config.frames; col++) {
                    const x = col * config.frameWidth;
                    const y = row * config.frameHeight;
                    
                    // 绘制帧背景
                    ctx.fillStyle = config.color;
                    ctx.fillRect(x, y, config.frameWidth, config.frameHeight);
                    
                    // 绘制帧边框
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(x, y, config.frameWidth, config.frameHeight);
                    
                    // 绘制帧编号
                    ctx.fillStyle = '#fff';
                    ctx.font = '12px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(frameIndex.toString(), x + config.frameWidth / 2, y + config.frameHeight / 2);
                    
                    frameIndex++;
                }
            }
            
            return canvas;
        }
        
        // 生成单张图像
        function generateSingleImage(config) {
            const canvas = document.createElement('canvas');
            canvas.width = config.width;
            canvas.height = config.height;
            const ctx = canvas.getContext('2d');
            
            // 清除背景
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (config.gradient) {
                // 创建渐变背景
                const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                gradient.addColorStop(0, config.color);
                gradient.addColorStop(1, '#ffffff');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else if (config.mountains) {
                // 创建山脉背景
                ctx.fillStyle = config.color;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 绘制山脉
                ctx.fillStyle = '#2c3e50';
                ctx.beginPath();
                ctx.moveTo(0, canvas.height);
                
                // 第一座山
                ctx.lineTo(0, canvas.height * 0.6);
                ctx.lineTo(canvas.width * 0.3, canvas.height * 0.3);
                ctx.lineTo(canvas.width * 0.5, canvas.height * 0.7);
                
                // 第二座山
                ctx.lineTo(canvas.width * 0.7, canvas.height * 0.4);
                ctx.lineTo(canvas.width, canvas.height * 0.6);
                ctx.lineTo(canvas.width, canvas.height);
                
                ctx.closePath();
                ctx.fill();
            } else if (config.grid && config.name === 'tileset') {
                // 创建瓦片集
                const tileSize = 32;
                const numTiles = config.width / tileSize;
                
                // 绘制基础背景
                ctx.fillStyle = config.color;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 绘制不同类型的瓦片
                const tileColors = ['#8B4513', '#2ecc71', '#95a5a6', '#7f8c8d', '#bdc3c7'];
                
                for (let y = 0; y < numTiles; y++) {
                    for (let x = 0; x < numTiles; x++) {
                        const tileIndex = (y * numTiles + x) % tileColors.length;
                        ctx.fillStyle = tileColors[tileIndex];
                        ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
                        
                        // 绘制瓦片边框
                        ctx.strokeStyle = '#000';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(x * tileSize, y * tileSize, tileSize, tileSize);
                    }
                }
            } else {
                // 普通填充
                ctx.fillStyle = config.color;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            
            return canvas;
        }
        
        // 生成UI元素
        function generateUIElement(config) {
            const canvas = document.createElement('canvas');
            canvas.width = config.width;
            canvas.height = config.height;
            const ctx = canvas.getContext('2d');
            
            // 清除背景
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (config.rounded) {
                // 绘制圆角矩形
                const radius = 10;
                ctx.fillStyle = config.color;
                ctx.beginPath();
                ctx.moveTo(radius, 0);
                ctx.lineTo(canvas.width - radius, 0);
                ctx.quadraticCurveTo(canvas.width, 0, canvas.width, radius);
                ctx.lineTo(canvas.width, canvas.height - radius);
                ctx.quadraticCurveTo(canvas.width, canvas.height, canvas.width - radius, canvas.height);
                ctx.lineTo(radius, canvas.height);
                ctx.quadraticCurveTo(0, canvas.height, 0, canvas.height - radius);
                ctx.lineTo(0, radius);
                ctx.quadraticCurveTo(0, 0, radius, 0);
                ctx.closePath();
                ctx.fill();
            } else {
                // 普通矩形
                ctx.fillStyle = config.color;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            
            // 如果有文本，添加文本
            if (config.text) {
                ctx.fillStyle = '#fff';
                ctx.font = `${config.fontSize || 24}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(config.text, canvas.width / 2, canvas.height / 2);
            }
            
            return canvas;
        }
        
        // 创建图像卡片
        function createImageCard(name, canvas, container) {
            const card = document.createElement('div');
            card.className = 'image-card';
            
            const title = document.createElement('h3');
            title.textContent = name + '.png';
            
            const downloadBtn = document.createElement('button');
            downloadBtn.textContent = '下载';
            downloadBtn.onclick = () => downloadImage(canvas, name);
            
            card.appendChild(title);
            card.appendChild(canvas);
            card.appendChild(downloadBtn);
            
            container.appendChild(card);
        }
        
        // 下载图像
        function downloadImage(canvas, name) {
            const link = document.createElement('a');
            link.download = name + '.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
        
        // 下载所有图像
        function downloadAllImages() {
            // 创建一个计数器来跟踪下载进度
            let totalImages = spritesheets.length + singleImages.length + uiElements.length;
            let downloadedImages = 0;
            
            // 显示下载进度
            alert(`开始下载 ${totalImages} 个图像，请在每个下载对话框出现时点击保存。`);
            
            // 按顺序下载所有图像，确保浏览器有足够时间处理每个下载
            function downloadNext(imageList, containerSelector, index = 0) {
                if (index >= imageList.length) {
                    // 当前列表下载完成，继续下一个列表
                    if (containerSelector === '#spritesheets') {
                        setTimeout(() => downloadNext(singleImages, '#single-images'), 300);
                    } else if (containerSelector === '#single-images') {
                        setTimeout(() => downloadNext(uiElements, '#ui-elements'), 300);
                    } else {
                        // 所有下载完成
                        alert('所有图像已下载完成！请将它们放入 assets/images 目录中。');
                    }
                    return;
                }
                
                // 获取当前图像的canvas
                const canvas = document.querySelector(`${containerSelector} canvas[data-name="${imageList[index].name}"]`);
                if (canvas) {
                    // 下载当前图像
                    const name = imageList[index].name;
                    const link = document.createElement('a');
                    link.download = name + '.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    
                    downloadedImages++;
                    console.log(`已下载 ${downloadedImages}/${totalImages}: ${name}.png`);
                    
                    // 延迟下载下一个图像，给浏览器时间处理当前下载
                    setTimeout(() => downloadNext(imageList, containerSelector, index + 1), 300);
                } else {
                    console.error(`找不到图像: ${imageList[index].name}`);
                    // 跳过当前图像，继续下一个
                    setTimeout(() => downloadNext(imageList, containerSelector, index + 1), 100);
                }
            }
            
            // 开始下载第一个列表（精灵表）
            downloadNext(spritesheets, '#spritesheets');
        }
        
        // 生成所有图像
        window.onload = function() {
            const spritesheetsContainer = document.getElementById('spritesheets');
            const singleImagesContainer = document.getElementById('single-images');
            const uiElementsContainer = document.getElementById('ui-elements');
            
            // 生成精灵表
            spritesheets.forEach(config => {
                const canvas = generateSpritesheet(config);
                canvas.setAttribute('data-name', config.name);
                createImageCard(config.name, canvas, spritesheetsContainer);
            });
            
            // 生成单张图像
            singleImages.forEach(config => {
                const canvas = generateSingleImage(config);
                canvas.setAttribute('data-name', config.name);
                createImageCard(config.name, canvas, singleImagesContainer);
            });
            
            // 生成UI元素
            uiElements.forEach(config => {
                const canvas = generateUIElement(config);
                canvas.setAttribute('data-name', config.name);
                createImageCard(config.name, canvas, uiElementsContainer);
            });
        };
    </script>
</body>
</html>
