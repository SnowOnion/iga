<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>博丽灵梦大战</title>
    <link rel="stylesheet" href="https://npm.elemecdn.com/lxgw-wenkai-screen-webfont@1.1.0/style.css" />
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            touch-action: none;
            font-family: "LXGW WenKai Screen", -apple-system, sans-serif;
            position: fixed;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #gameContainer {
            position: relative;
            width: 400px;
            height: 800px;
        }

        #gameCanvas {
            position: absolute;
            left: 0;
            top: 0;
            background: #000;
            border: 1px solid #333;
            z-index: 0;
        }

        #dementorContainer {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        #gameInfo {
            position: absolute;
            right: -120px;
            top: 0;
            width: 100px;
            color: #fff;
            font-size: 18px;
            text-align: left;
            z-index: 2;
        }

        #score, #powerLevel {
            margin: 10px 0;
            padding: 5px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #333;
            border-radius: 5px;
        }

        #startMessage, #gameOver, #difficulty {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            z-index: 2;
        }

        #gameOver, #difficulty {
            display: none;
        }

        button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-family: inherit;
        }

        button:hover {
            background: #45a049;
        }

        .dementor {
            position: absolute;
            transform: translate(-50%, -50%);
            font-size: 40px;
            line-height: 1;
            z-index: 1;
            pointer-events: none;
            user-select: none;
        }

        #version {
            position: fixed;
            bottom: 10px;
            right: 10px;
            color: #666;
            font-size: 12px;
            z-index: 2;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="dementorContainer"></div>
        <div id="gameInfo">
            <div id="score">分数: 0</div>
            <div id="powerLevel">火力: 1</div>
        </div>
        <div id="startMessage">
            <h2>击退摄魂怪</h2>
            <p>用空格键或点击发射守护神咒</p>
            <p>用方向键或 WASD 移动</p>
            <div id="difficulty">
                <button class="difficulty-btn" data-difficulty="1">简单</button>
                <button class="difficulty-btn" data-difficulty="2">普通</button>
                <button class="difficulty-btn" data-difficulty="3">困难</button>
            </div>
        </div>
        <div id="gameOver">
            <h2>游戏结束</h2>
            <p>最终分数: <span id="finalScore">0</span></p>
            <button id="restartBtn">重新开始</button>
        </div>
    </div>
    <div id="version">v0.2.1</div>

    <script type="module">
        import Game from './js/game.js';
        window.game = new Game();

        // 等待 DOM 加载完成
        document.addEventListener('DOMContentLoaded', () => {
            // 设置难度按钮的事件监听
            document.querySelectorAll('.difficulty-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const difficulty = parseInt(btn.dataset.difficulty);
                    window.game.setDifficulty(difficulty);
                });
            });
        });
    </script>
</body>
</html>
